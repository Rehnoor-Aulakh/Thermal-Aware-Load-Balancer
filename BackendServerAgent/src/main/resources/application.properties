spring.application.name=BackendServerAgent

# The load-balancer relay consumes ws://<agent-ip>:8086/telemetry.
telemetry.interval-ms=2000
telemetry.websocket.host=0.0.0.0
telemetry.websocket.port=8086


# Fan control (ESP32 over USB serial). Leave the port empty to disable it.
# Examples: COM3 on Windows, /dev/ttyUSB0 on Linux, /dev/cu.usbserial-0001 on macOS.
fan.serial.port=
fan.serial.baud=115200
# CPU temperature (C) : fan speed (%)
fan.curve=55:30,70:45,80:65,85:80,90:100
# The temperature must fall this far before the fan slows down.
fan.hysteresis-celsius=3
# Older predictions are ignored and only the measured temperature is used.
fan.prediction.max-age-ms=6000
